<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mencari 3 Angka Terbesar</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        width: 420px;
      }

      h2 {
        margin-top: 0;
        color: #1f2937;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }

      #result {
        margin-top: 20px;
        font-weight: bold;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Mencari 3 Angka Terbesar</h2>
      <p>Array: [12, 5, 7, 9, 1, 8, 3, 10, 2]</p>
      <button onclick="lihatHasil()">Tampilkan Hasil</button>
      <div id="result"></div>
    </div>

    <script>
      function cariTigaTerbesar(arr) {
        const sorted = [...arr].sort((a, b) => b - a);
        return sorted.slice(0, 3);
      }

      function lihatHasil() {
        const angka = [12, 5, 7, 9, 1, 8, 3, 10, 2];
        const hasil = cariTigaTerbesar(angka);
        document.getElementById("result").textContent = "3 angka terbesar: " + hasil.join(", ");
      }
    </script>
  </body>
</html>
