<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Sort Nilai UAS</title>
<style>
  body{margin:0;padding:24px;min-height:100vh;text-align:center;color:#fff;
       font-family:Segoe UI,Arial,sans-serif;
       background:linear-gradient(135deg,#4f46e5,#9333ea,#ec4899)}
  button{border:0;border-radius:20px;padding:10px 20px;margin:4px;font-weight:bold;cursor:pointer}
  #grafik{display:flex;align-items:flex-end;gap:6px;height:360px;max-width:900px;
          margin:20px auto;padding:16px 10px 0;background:rgba(255,255,255,.15);border-radius:16px}
  .bar{flex:1;background:#fff;color:#4f46e5;border-radius:8px 8px 0 0;
       font-size:11px;font-weight:bold;padding-top:4px}
  .bar span{display:block;writing-mode:vertical-rl;margin:4px auto}
  .cek{background:#facc15}
  .tukar{background:#f43f5e;color:#fff}
</style>
</head>
<body>
  <h1>Bubble Sort Nilai UAS</h1>
  <button onclick="urutkan('asc')">Ascending ▲</button>
  <button onclick="urutkan('desc')">Descending ▼</button>
  <button onclick="reset()">Reset</button>
  <div id="grafik"></div>
  <p id="info"></p>

<script>
  const NOMOR_ABSEN = 6;

  // Array berisi nama mahasiswa dan nilai ujian (10 + nomor absen)
  const nilaiUAS = [
    {nama:"Asti",nilai:99.8},{nama:"Kalista",nilai:87.1},{nama:"Caca",nilai:78.5},{nama:"Yane",nilai:92.3},
    {nama:"Adit",nilai:65.0},{nama:"Farel",nilai:81.7},{nama:"Claudia",nilai:73.4},{nama:"Nova",nilai:88.9},
    {nama:"Hendra",nilai:59.2},{nama:"Indah",nilai:94.6},{nama:"Joko",nilai:70.8},{nama:"Kartika",nilai:85.5},
    {nama:"Lukman",nilai:62.3},{nama:"Maya",nilai:90.1},{nama:"Naufal",nilai:76.9},{nama:"Olivia",nilai:83.2}
  ].slice(0, 10 + NOMOR_ABSEN);

  let data = [...nilaiUAS], jalan = false;
  const tunggu = ms => new Promise(r => setTimeout(r, ms));

  // Menggambar batang; a dan b = batang yang sedang disorot
  function gambar(a = -1, b = -1, kelas = "") {
    document.getElementById("grafik").innerHTML = data.map((d, i) =>
      `<div class="bar ${i == a || i == b ? kelas : ""}" style="height:${(d.nilai - 40) * 5}px">
         ${d.nilai}<span>${d.nama}</span></div>`).join("");
  }

  // Bubble Sort: mode "asc" atau "desc"
  async function urutkan(mode) {
    if (jalan) return;
    jalan = true; data = [...nilaiUAS];
    for (let i = 0; i < data.length - 1; i++) {
      for (let j = 0; j < data.length - i - 1; j++) {
        gambar(j, j + 1, "cek"); await tunggu(100);
        let tukar = mode == "asc" ? data[j].nilai > data[j + 1].nilai
                                  : data[j].nilai < data[j + 1].nilai;
        if (tukar) {
          [data[j], data[j + 1]] = [data[j + 1], data[j]];
          gambar(j, j + 1, "tukar"); await tunggu(100);
        }
      }
    }
    gambar();
    document.getElementById("info").textContent =
      "Selesai! Data terurut " + (mode == "asc" ? "Ascending" : "Descending");
    jalan = false;
  }

  function reset() {
    if (jalan) return;
    data = [...nilaiUAS]; gambar();
    document.getElementById("info").textContent = "";
  }

  gambar();
</script>
</body>
</html>
